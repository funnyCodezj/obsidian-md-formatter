name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: |
          npm install
          npm run build

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          mkdir -p release
          cp main.js manifest.json styles.css release/

          cd release
          zip -r "../md-formatter-${tag}.zip" .

          gh release create "$tag" \
            --title "$tag" \
            --notes "See [README](README.md) for details." \
            "../md-formatter-${tag}.zip" main.js manifest.json styles.css
